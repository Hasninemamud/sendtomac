<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script>
    try {
      var saved = localStorage.getItem("sendtomac-theme");
      if (saved === "night" || (!saved && matchMedia("(prefers-color-scheme: dark)").matches))
        document.documentElement.dataset.theme = "night";
    } catch (e) {}
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>SendToMac</title>
  <link rel="icon" href="/logo.png?v=4" type="image/png">
  <link rel="apple-touch-icon" href="/logo.png?v=4">
  <link rel="stylesheet" href="/theme.css">
  <style>
    @font-face {
      font-family: "Newsreader";
      src: url("/fonts/newsreader-400.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: "Newsreader";
      src: url("/fonts/newsreader-italic.woff2") format("woff2");
      font-weight: 400;
      font-style: italic;
      font-display: swap;
    }
    @font-face {
      font-family: "Newsreader";
      src: url("/fonts/newsreader-500.woff2") format("woff2");
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: "Newsreader";
      src: url("/fonts/newsreader-600.woff2") format("woff2");
      font-weight: 600;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: "Outfit";
      src: url("/fonts/outfit-latin.woff2") format("woff2");
      font-weight: 400 500;
      font-display: swap;
    }
    @font-face {
      font-family: "Outfit";
      src: url("/fonts/outfit-600.woff2") format("woff2");
      font-weight: 600;
      font-display: swap;
    }
    @font-face {
      font-family: "Outfit";
      src: url("/fonts/outfit-700.woff2") format("woff2");
      font-weight: 700;
      font-display: swap;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      font-family: "Outfit", "Avenir Next", "Segoe UI", sans-serif;
      padding: calc(22px + env(safe-area-inset-top)) 20px calc(28px + env(safe-area-inset-bottom));
    }
    main, header { max-width: 880px; margin: 0 auto; }
    .kicker {
      margin: 0;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 600;
    }
    .bar { display: flex; align-items: center; gap: 12px; margin: 0 0 14px; }
    .brand { display: flex; align-items: center; gap: 9px; text-decoration: none; color: inherit; }
    .bar-actions {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .site, .legal {
      font-size: 13px;
      color: var(--muted);
      text-decoration: none;
      white-space: nowrap;
    }
    .site:hover, .legal:hover { color: var(--ink); text-decoration: underline; }
    .theme {
      width: 36px;
      height: 36px;
      min-width: 36px;
      min-height: 36px;
      border-radius: 50%;
      padding: 0;
      flex: none;
      aspect-ratio: 1 / 1;
    }
    h1 {
      margin: 0 0 8px;
      font-family: "Newsreader", "Iowan Old Style", Georgia, serif;
      font-size: 36px;
      letter-spacing: -0.03em;
      font-weight: 500;
      line-height: 1.05;
    }
    #status {
      margin: 0;
      color: var(--muted);
      line-height: 1.5;
      max-width: 40rem;
      font-size: 15px;
    }
    #status.ok, #status.bad {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      padding: 7px 12px;
      border-radius: 999px;
      font-size: 13px;
      max-width: none;
      border: 1px solid var(--line);
      background: var(--panel);
    }
    #status.ok { color: var(--ok); }
    #status.bad { color: var(--bad); }
    .layout {
      display: grid;
      grid-template-columns: 240px 1fr;
      gap: 24px;
      margin-top: 24px;
      align-items: start;
    }
    .qr-wrap {
      padding: 12px;
      border-radius: 22px;
      background: var(--panel);
      border: 1px solid var(--line);
      width: fit-content;
    }
    #qr {
      width: 220px;
      height: 220px;
      background: #fff;
      border-radius: 14px;
      overflow: hidden;
    }
    #qr svg { width: 220px; height: 220px; display: block; }
    .url { margin: 12px 0 0; font-size: 13px; word-break: break-all; color: var(--muted); }
    .code {
      margin: 12px 0 0;
      font-size: 14px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .code strong {
      letter-spacing: 0.16em;
      color: var(--ink);
      font-family: "Newsreader", Georgia, serif;
      font-size: 16px;
      font-weight: 500;
    }
    .side-copy {
      margin: 0;
      color: var(--muted);
      line-height: 1.55;
      font-size: 15px;
    }
    button, input, textarea, .ghost { font: inherit; }
    button, .ghost {
      border: 1px solid var(--line);
      background: var(--panel);
      color: inherit;
      border-radius: 999px;
      min-height: 44px;
      padding: 0 16px;
      cursor: pointer;
      transition: transform 160ms ease, border-color 160ms ease;
    }
    button:hover, .ghost:hover { border-color: var(--ink); transform: translateY(-1px); }
    button.primary {
      border: 0;
      background: var(--cta);
      color: var(--on-cta);
      width: 100%;
      min-height: 52px;
      font-size: 16px;
      font-weight: 600;
      margin-top: 12px;
    }
    button.primary:disabled { opacity: 0.4; transform: none; }
    textarea, input[type="text"] {
      width: 100%;
      border: 1px solid var(--line);
      background: var(--field);
      border-radius: 16px;
      font-size: 16px;
      padding: 12px 14px;
      color: inherit;
      outline: none;
    }
    textarea:focus, input[type="text"]:focus {
      border-color: var(--ink);
      box-shadow: 0 0 0 3px var(--glow);
    }
    textarea { min-height: 110px; resize: vertical; }
    .row { display: flex; gap: 8px; margin-top: 10px; }
    .ghost { display: flex; align-items: center; justify-content: center; flex: 1; }
    .ghost input { display: none; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .chip {
      background: var(--chip);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 13px;
    }
    #progress, .item { margin-top: 12px; font-size: 14px; }
    .item {
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 16px;
      padding: 12px 14px;
    }
    .ok { color: var(--ok); }
    .bad { color: var(--bad); }
    .join { margin-top: 16px; display: flex; gap: 8px; }
    .join input { flex: 1; border-radius: 999px; }
    html[data-app="app"] .cam { display: none; }
    html[data-app="app"] .brand { pointer-events: none; }
    html[data-app="app"] .site {
      pointer-events: auto;
      font-size: 11px;
    }
    html[data-app="app"] .legal { display: none; }
    html[data-app="app"] .theme {
      width: 30px;
      height: 30px;
      min-width: 30px;
      min-height: 30px;
      border-radius: 50%;
    }
    #share.drop, body.drop #share, .dropzone.over {
      border-color: var(--ink);
      background: color-mix(in srgb, var(--ink) 6%, transparent);
    }
    .dropzone {
      margin-top: 16px;
      border: 1.5px dashed var(--line);
      border-radius: 20px;
      min-height: 76px;
      display: grid;
      place-items: center;
      text-align: center;
      color: var(--muted);
      padding: 16px;
      background: var(--panel);
      transition: border-color 180ms ease, background 180ms ease;
    }
    .dropzone strong {
      color: var(--ink);
      display: block;
      margin-bottom: 4px;
      font-family: "Newsreader", Georgia, serif;
      font-weight: 500;
      font-size: 18px;
    }
    .drop-hint { margin: 8px 0 0; font-size: 13px; color: var(--muted); }

    @media (max-width: 720px) {
      body { padding: calc(18px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom)); }
      .layout { grid-template-columns: 1fr; gap: 18px; margin-top: 18px; }
      h1 { font-size: 32px; max-width: 10ch; }
      #status { font-size: 14px; }
      .qr-wrap { margin: 0 auto; padding: 14px; border-radius: 24px; }
      #qr, #qr svg { width: min(72vw, 240px); height: min(72vw, 240px); }
      .code { justify-content: center; font-size: 13px; }
      .code strong { font-size: 18px; letter-spacing: 0.18em; }
      #copy { width: 100%; margin-top: 12px; }
      .side-copy { text-align: center; font-size: 14px; }
      .join { flex-direction: column; }
      .join input, .join button { min-height: 48px; width: 100%; }
      button, .ghost { min-height: 48px; font-size: 15px; }
      button.primary { min-height: 54px; margin-top: 14px; }
      textarea { min-height: 120px; font-size: 16px; border-radius: 18px; }
      .dropzone { min-height: 88px; border-radius: 22px; }
      .dropzone strong { font-size: 20px; }
      .item { border-radius: 18px; }
    }

    html[data-app="app"] body { padding: 12px 14px 14px; }
    html[data-app="app"] .bar { margin-bottom: 6px; }
    html[data-app="app"] .brand .mark { width: 22px; height: 22px; }
    html[data-app="app"] .kicker { font-size: 10px; letter-spacing: 0.12em; }
    html[data-app="app"] h1 { font-size: 22px; margin: 0 0 4px; max-width: none; }
    html[data-app="app"] #status { font-size: 12px; line-height: 1.4; }
    html[data-app="app"] #status.ok,
    html[data-app="app"] #status.bad { padding: 4px 9px; font-size: 11px; margin-top: 4px; }
    html[data-app="app"] .layout { grid-template-columns: 156px 1fr; gap: 14px; margin-top: 10px; }
    html[data-app="app"] .qr-wrap { padding: 8px; border-radius: 16px; }
    html[data-app="app"] #qr,
    html[data-app="app"] #qr svg { width: 140px; height: 140px; }
    html[data-app="app"] .url { display: none; }
    html[data-app="app"] .code { margin: 8px 0 0; font-size: 11px; }
    html[data-app="app"] .code strong { font-size: 13px; letter-spacing: 0.14em; }
    html[data-app="app"] #copy,
    html[data-app="app"] .join button { min-height: 30px; font-size: 12px; padding: 0 12px; }
    html[data-app="app"] .side-copy { font-size: 12px; line-height: 1.4; text-align: left; }
    html[data-app="app"] .join { margin-top: 10px; flex-direction: row; }
    html[data-app="app"] .join input { min-height: 30px; font-size: 13px; padding: 6px 10px; }
    html[data-app="app"] .dropzone {
      min-height: 46px;
      margin-top: 10px;
      padding: 8px;
      font-size: 12px;
      border-radius: 14px;
    }
    html[data-app="app"] .dropzone strong { font-size: 14px; }
    html[data-app="app"] textarea { min-height: 64px; font-size: 13px; padding: 9px 11px; border-radius: 12px; }
    html[data-app="app"] button.primary { min-height: 36px; font-size: 14px; margin-top: 8px; }
    html[data-app="app"] .ghost { min-height: 34px; font-size: 12px; }
    html[data-app="app"] .item { padding: 8px 10px; font-size: 12px; border-radius: 12px; }
  </style>
</head>
<body>
  <header>
    <div class="bar">
      <a class="brand" href="/"><span class="mark" aria-hidden="true"></span><span class="kicker">SendToMac</span></a>
      <div class="bar-actions">
        <a class="site" href="https://sendtomac.vercel.app/" target="_blank" rel="noopener">Website</a>
        <button class="theme" type="button" data-theme-toggle aria-label="Night mode" aria-pressed="false">
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M15.2 2.8A8.8 8.8 0 1 0 21.2 16 7.4 7.4 0 0 1 15.2 2.8z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.4" fill="currentColor"/><g stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.2 5.2l1.6 1.6M17.2 17.2l1.6 1.6M18.8 5.2l-1.6 1.6"/></g></svg>
        </button>
        <a class="legal" href="/privacy">Privacy</a>
      </div>
    </div>
    <h1 id="title">Same Wi-Fi</h1>
    <p id="status">Open this page on the Mac. Scan the code with the phone. Then pick a file.</p>
  </header>
  <main id="pair">
    <div class="layout">
      <div>
        <div class="qr-wrap"><div id="qr"></div></div>
        <p class="url" id="link"></p>
        <p class="code">Code <strong id="code">····</strong></p>
        <button type="button" id="copy">Copy link</button>
      </div>
      <div>
        <p class="side-copy">Both devices must be on the same Wi-Fi. The scan only pairs them. A file is not uploaded to a public server.</p>
        <form class="join" id="joinForm">
          <input id="joinCode" type="text" inputmode="text" autocapitalize="none" autocomplete="off" spellcheck="false" maxlength="8" placeholder="Have a code?">
          <button type="submit">Join</button>
        </form>
      </div>
    </div>
  </main>
  <main id="share" hidden>
    <form id="sendForm">
      <textarea id="note" placeholder="Or a note, link, or address"></textarea>
      <div class="row">
        <label class="ghost">Photos or files<input id="files" type="file" multiple></label>
        <label class="ghost cam">Camera<input id="camera" type="file" accept="image/*" capture="environment"></label>
      </div>
      <div class="chips" id="chips"></div>
      <button class="primary" id="send" type="submit">Send</button>
    </form>
    <p id="progress"></p>
    <div id="inbox"></div>
  </main>
  <div id="dropzone" class="dropzone"><strong>Drop a file here</strong>It sends when the other device is connected.</div>
  <script src="/vendor/qrcode.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const inApp = params.get("app") === "1";
    const localKey = params.get("k") || "";
    const wanted = (params.get("r") || "").toLowerCase();
    if (inApp) {
      document.documentElement.dataset.app = "app";
      document.getElementById("status").textContent = "Scan this code with the phone. Or drop a file on this window.";
    }
    function macHeaders() {
      return localKey ? { "X-SendToMac-Key": localKey } : {};
    }
    const pairEl = document.getElementById("pair");
    const shareEl = document.getElementById("share");
    const statusEl = document.getElementById("status");
    const progressEl = document.getElementById("progress");
    const picked = [];
    let ws, room = wanted, token = "", mode = "relay", role = "offer", connected = false, socketTries = 0;
    let pc, channel, pendingIce = [], remoteSet = false, sendChain = Promise.resolve();
    let incoming = null;

    function setStatus(text, kind) {
      statusEl.textContent = text;
      statusEl.className = kind || "";
    }

    function showShare() {
      pairEl.hidden = true;
      shareEl.hidden = false;
      document.getElementById("title").textContent = "Connected";
      setStatus("Same Wi-Fi. Drop a file, or pick one, then send.", "ok");
      if (picked.length) sendNow(false);
    }

    function drawQr(url) {
      const el = document.getElementById("qr");
      const qr = qrcode(0, "M");
      qr.addData(url);
      qr.make();
      el.innerHTML = qr.createSvgTag({ cellSize: 4, margin: 10, scalable: true });
      document.getElementById("link").textContent = url;
      document.getElementById("copy").onclick = async () => {
        await navigator.clipboard.writeText(url);
        document.getElementById("copy").textContent = "Copied";
      };
    }

    function addFiles(list) {
      for (const file of list) picked.push(file);
      const box = document.getElementById("chips");
      box.replaceChildren();
      for (const file of picked) {
        const chip = document.createElement("span");
        chip.className = "chip";
        chip.textContent = file.name;
        box.appendChild(chip);
      }
    }

    document.getElementById("files").addEventListener("change", (e) => {
      addFiles(e.target.files);
      e.target.value = "";
    });
    document.getElementById("camera").addEventListener("change", (e) => {
      addFiles(e.target.files);
      e.target.value = "";
    });
    function addStaged(token, name) {
      return fetch("/api/staged/" + encodeURIComponent(token) + (localKey ? "?k=" + encodeURIComponent(localKey) : ""), {
        headers: macHeaders(),
      })
        .then((res) => {
          if (!res.ok) throw new Error("Could not read that file");
          return res.blob();
        })
        .then((blob) => {
          addFiles([new File([blob], name, { type: blob.type || "application/octet-stream" })]);
          if (connected) sendNow(false);
          else setStatus(name + " is ready. Scan the code, then it sends.", "ok");
        })
        .catch((err) => setStatus(err.message || "Could not read that file", "bad"));
    }
    window.addStaged = addStaged;
    const zone = document.getElementById("dropzone");
    function takeDrop(e) {
      const files = e.dataTransfer && e.dataTransfer.files;
      if (!files || !files.length) return;
      e.preventDefault();
      addFiles(files);
      zone.classList.remove("over");
      if (connected) sendNow(false);
      else setStatus("File ready. Scan the code, then it sends.", "ok");
    }
    window.addEventListener("dragover", (e) => {
      if (!e.dataTransfer || !Array.from(e.dataTransfer.types || []).includes("Files")) return;
      e.preventDefault();
      zone.classList.add("over");
    });
    window.addEventListener("dragleave", () => zone.classList.remove("over"));
    window.addEventListener("drop", takeDrop);
    document.getElementById("joinForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const code = document.getElementById("joinCode").value.trim().toLowerCase();
      if (code) {
        const next = new URLSearchParams();
        next.set("r", code);
        if (inApp) next.set("app", "1");
        if (localKey) next.set("k", localKey);
        location.search = "?" + next.toString();
      }
    });

    function noteReceived(name, folder) {
      const row = document.createElement("div");
      row.className = "item";
      row.textContent = folder ? "Saved " + name + " to " + folder : "Received " + name;
      document.getElementById("inbox").prepend(row);
    }

    async function keepOnMac(blob, name) {
      const body = new FormData();
      body.append("file", blob, name);
      const res = await fetch("/api/save", { method: "POST", body, headers: macHeaders() });
      const data = await res.json();
      if (!res.ok || !data.ok) throw new Error(data.error || "Could not save that file");
      noteReceived(data.name || name, data.folder);
    }

    function saveBlob(blob, name) {
      if (inApp) {
        keepOnMac(blob, name).catch((err) => setStatus(err.message || "Could not save that file", "bad"));
        return;
      }
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = name;
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 30000);
      noteReceived(name);
    }

    function connectSocket() {
      const proto = location.protocol === "https:" ? "wss://" : "ws://";
      ws = new WebSocket(proto + location.host + "/ws");
      ws.onopen = () => {
        ws.send(JSON.stringify(wanted ? { type: "join", room: wanted } : { type: "create", room: room || "" }));
      };
      ws.onmessage = (ev) => {
        const msg = JSON.parse(ev.data);
        if (msg.type === "error") {
          pairEl.hidden = false;
          setStatus(msg.error, "bad");
          return;
        }
        if (msg.type === "ready") {
          room = msg.room;
          token = msg.token;
          mode = msg.mode;
          role = msg.role;
          document.getElementById("code").textContent = room;
          if (!wanted && msg.base) drawQr(msg.base + "/share?r=" + room);
          if (!wanted && !msg.base) setStatus("This Mac has no Wi-Fi address yet.", "bad");
          if (wanted) setStatus("Connecting…");
          else setStatus(inApp ? "Scan this with the phone camera. Press Option + Command to open this again." : "Scan this with the phone camera. Leave this page open.");
          if (!msg.waiting) onPeer();
          return;
        }
        if (msg.type === "peer") onPeer();
        if (msg.type === "left") {
          connected = false;
          setStatus("The other device left. Scan again.", "bad");
          shareEl.hidden = true;
          pairEl.hidden = false;
        }
        if (msg.type === "text") showText(msg.text);
        if (msg.type === "file") downloadRelay(msg);
        if (msg.type === "signal") onSignal(msg.data);
      };
      ws.onclose = () => {
        if (connected) return;
        if (++socketTries > 2) {
          setStatus("Open the SendToMac app on the Mac. Leave it open, then scan the code. Same Wi-Fi.", "bad");
          return;
        }
        setTimeout(connectSocket, 1200);
      };
    }

    function onPeer() {
      if (mode === "relay") {
        connected = true;
        showShare();
        return;
      }
      setStatus("Connecting on this Wi-Fi…");
      startWebRTC();
    }

    function startWebRTC() {
      if (pc) return;
      pc = new RTCPeerConnection({ iceServers: [{ urls: "stun:stun.l.google.com:19302" }] });
      pc.onicecandidate = (e) => {
        if (e.candidate) signal({ kind: "ice", candidate: e.candidate });
      };
      pc.ondatachannel = (e) => bindChannel(e.channel);
      pc.onconnectionstatechange = () => {
        if (pc.connectionState === "failed") {
          setStatus("Not on the same Wi-Fi, or this network blocks devices from seeing each other. Use a normal Wi-Fi, or join the phone hotspot from the Mac and scan again.", "bad");
        }
      };
      if (role === "offer") {
        bindChannel(pc.createDataChannel("files", { ordered: true }));
        pc.createOffer().then((offer) => pc.setLocalDescription(offer)).then(() => {
          signal({ kind: "offer", sdp: pc.localDescription });
        });
      }
    }

    function signal(data) {
      if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: "signal", data }));
    }

    async function onSignal(data) {
      if (!data) return;
      if (!pc) startWebRTC();
      if (data.kind === "offer" || data.kind === "answer") {
        await pc.setRemoteDescription(data.sdp);
        remoteSet = true;
        for (const c of pendingIce) await pc.addIceCandidate(c);
        pendingIce = [];
        if (data.kind === "offer") {
          const answer = await pc.createAnswer();
          await pc.setLocalDescription(answer);
          signal({ kind: "answer", sdp: pc.localDescription });
        }
      } else if (data.kind === "ice" && data.candidate) {
        if (!remoteSet) pendingIce.push(data.candidate);
        else await pc.addIceCandidate(data.candidate);
      }
    }

    function bindChannel(ch) {
      channel = ch;
      channel.binaryType = "arraybuffer";
      channel.onopen = () => {
        connected = true;
        showShare();
      };
      channel.onmessage = onChannel;
    }

    function onChannel(ev) {
      if (typeof ev.data === "string") {
        const msg = JSON.parse(ev.data);
        if (msg.t === "text") showText(msg.text);
        if (msg.t === "file") incoming = { name: msg.name, mime: msg.mime, parts: [], got: 0, size: msg.size };
        if (msg.t === "end" && incoming) {
          saveBlob(new Blob(incoming.parts, { type: incoming.mime || "application/octet-stream" }), incoming.name);
          incoming = null;
          progressEl.textContent = "";
        }
        return;
      }
      if (!incoming) return;
      incoming.parts.push(ev.data);
      incoming.got += ev.data.byteLength;
      if (incoming.size) progressEl.textContent = "Receiving " + Math.round((incoming.got / incoming.size) * 100) + "%";
    }

    function showText(text) {
      const row = document.createElement("div");
      row.className = "item";
      const p = document.createElement("p");
      p.textContent = text;
      const btn = document.createElement("button");
      btn.type = "button";
      btn.textContent = "Copy";
      btn.onclick = () => navigator.clipboard.writeText(text);
      row.append(p, btn);
      document.getElementById("inbox").prepend(row);
    }

    function enqueue(fn) {
      sendChain = sendChain.then(fn, fn);
      return sendChain;
    }

    async function sendDirect(file) {
      channel.send(JSON.stringify({ t: "file", name: file.name, size: file.size, mime: file.type }));
      const size = 16 * 1024;
      for (let offset = 0; offset < file.size; offset += size) {
        while (channel.bufferedAmount > 1024 * 1024) await new Promise((r) => setTimeout(r, 20));
        channel.send(await file.slice(offset, offset + size).arrayBuffer());
        progressEl.textContent = "Sending " + file.name + " " + Math.min(100, Math.round(((offset + size) / file.size) * 100)) + "%";
      }
      channel.send(JSON.stringify({ t: "end" }));
    }

    function sendRelay(file) {
      return new Promise((resolve, reject) => {
        const body = new FormData();
        body.append("token", token);
        body.append("file", file, file.name);
        const xhr = new XMLHttpRequest();
        xhr.open("POST", "/api/upload");
        xhr.upload.onprogress = (ev) => {
          if (ev.lengthComputable) progressEl.textContent = "Sending " + file.name + " " + Math.round((ev.loaded / ev.total) * 100) + "%";
        };
        xhr.onload = () => (xhr.status < 300 ? resolve() : reject(new Error("The other device did not get that")));
        xhr.onerror = () => reject(new Error("Could not reach the other device"));
        xhr.send(body);
      });
    }

    function downloadRelay(meta) {
      if (inApp) {
        fetch("/api/file/" + encodeURIComponent(meta.id) + "?token=" + encodeURIComponent(token))
          .then((res) => res.blob())
          .then((blob) => keepOnMac(blob, meta.name))
          .catch((err) => setStatus(err.message || "Could not save that file", "bad"));
        return;
      }
      const a = document.createElement("a");
      a.href = "/api/file/" + encodeURIComponent(meta.id) + "?token=" + encodeURIComponent(token);
      a.download = meta.name;
      a.click();
      noteReceived(meta.name);
    }

    function sendNow(includeNote) {
      const note = includeNote ? document.getElementById("note").value.trim() : "";
      if (!connected) {
        progressEl.textContent = "Scan the code first. The file sends after that.";
        progressEl.className = "bad";
        return;
      }
      if (!note && !picked.length) return;
      const files = picked.splice(0);
      document.getElementById("chips").replaceChildren();
      document.getElementById("send").disabled = true;
      enqueue(async () => {
        if (note) {
          if (mode === "webrtc" && channel && channel.readyState === "open") channel.send(JSON.stringify({ t: "text", text: note }));
          else ws.send(JSON.stringify({ type: "text", text: note }));
          document.getElementById("note").value = "";
        }
        for (const file of files) {
          if (mode === "webrtc") await sendDirect(file);
          else await sendRelay(file);
        }
        progressEl.textContent = "Sent.";
        progressEl.className = "ok";
        document.getElementById("send").disabled = false;
      }).catch((err) => {
        progressEl.textContent = err.message || "Send failed.";
        progressEl.className = "bad";
        document.getElementById("send").disabled = false;
      });
    }

    document.getElementById("sendForm").addEventListener("submit", (e) => {
      e.preventDefault();
      sendNow(true);
    });

    if (wanted) {
      pairEl.hidden = true;
      document.getElementById("title").textContent = "Joining";
      setStatus("Connecting to the other device…");
    }
    connectSocket();
  </script>
  <script src="/theme.js"></script>
</body>
</html>
