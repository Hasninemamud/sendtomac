<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script>
    try {
      var saved = localStorage.getItem("sendtomac-theme");
      if (saved === "night" || (!saved && matchMedia("(prefers-color-scheme: dark)").matches))
        document.documentElement.dataset.theme = "night";
    } catch (e) {}
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1c1917">
  <title>SendToMac</title>
  <link rel="icon" href="/logo.png?v=4" type="image/png">
  <link rel="apple-touch-icon" href="/logo.png?v=4">
  <link rel="stylesheet" href="/theme.css">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: calc(20px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom));
    }
    main, header { max-width: 880px; margin: 0 auto; }
    .kicker { margin: 0; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
    .bar { display: flex; align-items: center; gap: 12px; margin: 0 0 8px; }
    .brand { display: flex; align-items: center; gap: 8px; text-decoration: none; color: inherit; }
    .brand img { width: 22px; height: 22px; border-radius: 6px; }
    .bar .theme { margin-left: auto; }
    .legal { font-size: 13px; color: var(--muted); text-decoration: none; }
    h1 { margin: 4px 0 6px; font-size: 32px; letter-spacing: -0.03em; font-weight: 650; }
    #status { margin: 0; color: var(--muted); line-height: 1.45; max-width: 42rem; }
    .layout { display: grid; grid-template-columns: 240px 1fr; gap: 28px; margin-top: 22px; align-items: start; }
    #qr { width: 220px; height: 220px; background: #fff; border-radius: 12px; }
    #qr svg { width: 220px; height: 220px; display: block; }
    .url { margin: 12px 0 0; font-size: 13px; word-break: break-all; color: var(--muted); }
    .code { margin: 10px 0; font-size: 15px; }
    .code strong { letter-spacing: 0.16em; }
    button, input, textarea, .ghost { font: inherit; }
    button, .ghost {
      border: 1px solid var(--line);
      background: transparent;
      color: inherit;
      border-radius: 12px;
      min-height: 44px;
      padding: 0 14px;
    }
    button.primary {
      border: 0;
      background: var(--cta);
      color: var(--on-cta);
      width: 100%;
      min-height: 52px;
      font-size: 16px;
      font-weight: 600;
      margin-top: 12px;
    }
    button.primary:disabled { opacity: 0.4; }
    textarea, input[type="text"] {
      width: 100%;
      border: 1px solid var(--line);
      background: var(--field);
      border-radius: 12px;
      font-size: 16px;
      padding: 12px;
      color: inherit;
    }
    textarea { min-height: 110px; resize: vertical; }
    .row { display: flex; gap: 8px; margin-top: 10px; }
    .ghost { display: flex; align-items: center; justify-content: center; flex: 1; }
    .ghost input { display: none; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .chip { background: var(--chip); border-radius: 999px; padding: 6px 10px; font-size: 13px; }
    #progress, .item { margin-top: 12px; font-size: 14px; }
    .item { border-top: 1px solid var(--rule); padding-top: 10px; }
    .ok { color: var(--ok); }
    .bad { color: var(--bad); }
    .join { margin-top: 18px; display: flex; gap: 8px; }
    .join input { flex: 1; }
    html[data-app="app"] .cam, html[data-app="app"] .legal { display: none; }
    html[data-app="app"] .brand { pointer-events: none; }
    #share.drop, body.drop #share { outline: 2px dashed var(--cta); outline-offset: 6px; border-radius: 16px; }
    .drop-hint { margin: 8px 0 0; font-size: 13px; color: var(--muted); }
    @media (max-width: 720px) {
      .layout { grid-template-columns: 1fr; }
      h1 { font-size: 28px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="bar">
      <a class="brand" href="/"><img src="/logo.png?v=4" alt=""><span class="kicker">SendToMac</span></a>
      <button class="theme" type="button" data-theme-toggle aria-label="Night mode" aria-pressed="false">
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M15.2 2.8A8.8 8.8 0 1 0 21.2 16 7.4 7.4 0 0 1 15.2 2.8z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.4" fill="currentColor"/><g stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.2 5.2l1.6 1.6M17.2 17.2l1.6 1.6M18.8 5.2l-1.6 1.6M6.8 17.2l-1.6 1.6"/></g></svg>
      </button>
      <a class="legal" href="/privacy">Privacy</a>
    </div>
    <h1 id="title">Same Wi-Fi</h1>
    <p id="status">Open this page on the Mac. Scan the code with the phone. Then pick a file.</p>
  </header>
  <main id="pair">
    <div class="layout">
      <div>
        <div id="qr"></div>
        <p class="url" id="link"></p>
        <p class="code">Code <strong id="code">····</strong></p>
        <button type="button" id="copy">Copy link</button>
      </div>
      <div>
        <p>Both devices must be on the same Wi-Fi. The scan only pairs them. A file is not uploaded to a public server.</p>
        <form class="join" id="joinForm">
          <input id="joinCode" type="text" inputmode="text" autocapitalize="none" autocomplete="off" spellcheck="false" maxlength="8" placeholder="Have a code?">
          <button type="submit">Join</button>
        </form>
      </div>
    </div>
  </main>
  <main id="share" hidden>
    <form id="sendForm">
      <textarea id="note" placeholder="Or a note, link, or address"></textarea>
      <div class="row">
        <label class="ghost">Photos or files<input id="files" type="file" multiple></label>
        <label class="ghost cam">Camera<input id="camera" type="file" accept="image/*" capture="environment"></label>
      </div>
      <div class="chips" id="chips"></div>
      <button class="primary" id="send" type="submit">Send</button>
      <p class="drop-hint">Or drop a file here.</p>
    </form>
    <p id="progress"></p>
    <div id="inbox"></div>
  </main>
  <script src="/vendor/qrcode.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const inApp = params.get("app") === "1";
    const wanted = (params.get("r") || "").toLowerCase();
    if (inApp) {
      document.documentElement.dataset.app = "app";
      document.getElementById("status").textContent = "Scan this code with the phone. Same Wi-Fi. Then send the file.";
    }
    const pairEl = document.getElementById("pair");
    const shareEl = document.getElementById("share");
    const statusEl = document.getElementById("status");
    const progressEl = document.getElementById("progress");
    const picked = [];
    let ws, room = wanted, token = "", mode = "relay", role = "offer", connected = false, socketTries = 0;
    let pc, channel, pendingIce = [], remoteSet = false, sendChain = Promise.resolve();
    let incoming = null;

    function setStatus(text, kind) {
      statusEl.textContent = text;
      statusEl.className = kind || "";
    }

    function showShare() {
      pairEl.hidden = true;
      shareEl.hidden = false;
      document.getElementById("title").textContent = "Connected";
      setStatus("Same Wi-Fi. Pick a file or write a note, then send.", "ok");
    }

    function drawQr(url) {
      const el = document.getElementById("qr");
      const qr = qrcode(0, "M");
      qr.addData(url);
      qr.make();
      el.innerHTML = qr.createSvgTag({ cellSize: 4, margin: 10, scalable: true });
      document.getElementById("link").textContent = url;
      document.getElementById("copy").onclick = async () => {
        await navigator.clipboard.writeText(url);
        document.getElementById("copy").textContent = "Copied";
      };
    }

    function addFiles(list) {
      for (const file of list) picked.push(file);
      const box = document.getElementById("chips");
      box.replaceChildren();
      for (const file of picked) {
        const chip = document.createElement("span");
        chip.className = "chip";
        chip.textContent = file.name;
        box.appendChild(chip);
      }
    }

    document.getElementById("files").addEventListener("change", (e) => {
      addFiles(e.target.files);
      e.target.value = "";
    });
    document.getElementById("camera").addEventListener("change", (e) => {
      addFiles(e.target.files);
      e.target.value = "";
    });
    function addStaged(token, name) {
      return fetch("/api/staged/" + encodeURIComponent(token))
        .then((res) => {
          if (!res.ok) throw new Error("Could not read that file");
          return res.blob();
        })
        .then((blob) => {
          addFiles([new File([blob], name, { type: blob.type || "application/octet-stream" })]);
          if (!connected) setStatus(name + " is ready. Scan the code, then send.", "ok");
        })
        .catch((err) => setStatus(err.message || "Could not read that file", "bad"));
    }
    window.addStaged = addStaged;
    const shareElEarly = document.getElementById("share");
    function takeDrop(e) {
      const files = e.dataTransfer && e.dataTransfer.files;
      if (!files || !files.length) return;
      e.preventDefault();
      shareElEarly.classList.remove("drop");
      addFiles(files);
      if (!connected) setStatus("File ready. Scan the code, then send.", "ok");
    }
    window.addEventListener("dragover", (e) => {
      if (!e.dataTransfer || !Array.from(e.dataTransfer.types || []).includes("Files")) return;
      e.preventDefault();
      shareElEarly.classList.add("drop");
    });
    window.addEventListener("dragleave", (e) => {
      if (e.target === document.documentElement || e.target === document.body) shareElEarly.classList.remove("drop");
    });
    window.addEventListener("drop", takeDrop);
    document.getElementById("joinForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const code = document.getElementById("joinCode").value.trim().toLowerCase();
      if (code) {
        const next = new URLSearchParams();
        next.set("r", code);
        if (inApp) next.set("app", "1");
        location.search = "?" + next.toString();
      }
    });

    function noteReceived(name, folder) {
      const row = document.createElement("div");
      row.className = "item";
      row.textContent = folder ? "Saved " + name + " to " + folder : "Received " + name;
      document.getElementById("inbox").prepend(row);
    }

    async function keepOnMac(blob, name) {
      const body = new FormData();
      body.append("file", blob, name);
      const res = await fetch("/api/save", { method: "POST", body });
      const data = await res.json();
      if (!res.ok || !data.ok) throw new Error(data.error || "Could not save that file");
      noteReceived(data.name || name, data.folder);
    }

    function saveBlob(blob, name) {
      if (inApp) {
        keepOnMac(blob, name).catch((err) => setStatus(err.message || "Could not save that file", "bad"));
        return;
      }
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = name;
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 30000);
      noteReceived(name);
    }

    function connectSocket() {
      const proto = location.protocol === "https:" ? "wss://" : "ws://";
      ws = new WebSocket(proto + location.host + "/ws");
      ws.onopen = () => {
        ws.send(JSON.stringify(wanted ? { type: "join", room: wanted } : { type: "create", room: room || "" }));
      };
      ws.onmessage = (ev) => {
        const msg = JSON.parse(ev.data);
        if (msg.type === "error") {
          pairEl.hidden = false;
          setStatus(msg.error, "bad");
          return;
        }
        if (msg.type === "ready") {
          room = msg.room;
          token = msg.token;
          mode = msg.mode;
          role = msg.role;
          document.getElementById("code").textContent = room;
          if (!wanted && msg.base) drawQr(msg.base + "/share?r=" + room);
          if (!wanted && !msg.base) setStatus("This Mac has no Wi-Fi address yet.", "bad");
          if (wanted) setStatus("Connecting…");
          else setStatus(inApp ? "Scan this with the phone camera. Press Option + Command to open this again." : "Scan this with the phone camera. Leave this page open.");
          if (!msg.waiting) onPeer();
          return;
        }
        if (msg.type === "peer") onPeer();
        if (msg.type === "left") {
          connected = false;
          setStatus("The other device left. Scan again.", "bad");
          shareEl.hidden = true;
          pairEl.hidden = false;
        }
        if (msg.type === "text") showText(msg.text);
        if (msg.type === "file") downloadRelay(msg);
        if (msg.type === "signal") onSignal(msg.data);
      };
      ws.onclose = () => {
        if (connected) return;
        if (++socketTries > 2) {
          setStatus("Open the SendToMac app on the Mac. Leave it open, then scan the code. Same Wi-Fi.", "bad");
          return;
        }
        setTimeout(connectSocket, 1200);
      };
    }

    function onPeer() {
      if (mode === "relay") {
        connected = true;
        showShare();
        return;
      }
      setStatus("Connecting on this Wi-Fi…");
      startWebRTC();
    }

    function startWebRTC() {
      if (pc) return;
      pc = new RTCPeerConnection({ iceServers: [{ urls: "stun:stun.l.google.com:19302" }] });
      pc.onicecandidate = (e) => {
        if (e.candidate) signal({ kind: "ice", candidate: e.candidate });
      };
      pc.ondatachannel = (e) => bindChannel(e.channel);
      pc.onconnectionstatechange = () => {
        if (pc.connectionState === "failed") {
          setStatus("Not on the same Wi-Fi, or this network blocks devices from seeing each other. Use a normal Wi-Fi, or join the phone hotspot from the Mac and scan again.", "bad");
        }
      };
      if (role === "offer") {
        bindChannel(pc.createDataChannel("files", { ordered: true }));
        pc.createOffer().then((offer) => pc.setLocalDescription(offer)).then(() => {
          signal({ kind: "offer", sdp: pc.localDescription });
        });
      }
    }

    function signal(data) {
      if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: "signal", data }));
    }

    async function onSignal(data) {
      if (!data) return;
      if (!pc) startWebRTC();
      if (data.kind === "offer" || data.kind === "answer") {
        await pc.setRemoteDescription(data.sdp);
        remoteSet = true;
        for (const c of pendingIce) await pc.addIceCandidate(c);
        pendingIce = [];
        if (data.kind === "offer") {
          const answer = await pc.createAnswer();
          await pc.setLocalDescription(answer);
          signal({ kind: "answer", sdp: pc.localDescription });
        }
      } else if (data.kind === "ice" && data.candidate) {
        if (!remoteSet) pendingIce.push(data.candidate);
        else await pc.addIceCandidate(data.candidate);
      }
    }

    function bindChannel(ch) {
      channel = ch;
      channel.binaryType = "arraybuffer";
      channel.onopen = () => {
        connected = true;
        showShare();
      };
      channel.onmessage = onChannel;
    }

    function onChannel(ev) {
      if (typeof ev.data === "string") {
        const msg = JSON.parse(ev.data);
        if (msg.t === "text") showText(msg.text);
        if (msg.t === "file") incoming = { name: msg.name, mime: msg.mime, parts: [], got: 0, size: msg.size };
        if (msg.t === "end" && incoming) {
          saveBlob(new Blob(incoming.parts, { type: incoming.mime || "application/octet-stream" }), incoming.name);
          incoming = null;
          progressEl.textContent = "";
        }
        return;
      }
      if (!incoming) return;
      incoming.parts.push(ev.data);
      incoming.got += ev.data.byteLength;
      if (incoming.size) progressEl.textContent = "Receiving " + Math.round((incoming.got / incoming.size) * 100) + "%";
    }

    function showText(text) {
      const row = document.createElement("div");
      row.className = "item";
      const p = document.createElement("p");
      p.textContent = text;
      const btn = document.createElement("button");
      btn.type = "button";
      btn.textContent = "Copy";
      btn.onclick = () => navigator.clipboard.writeText(text);
      row.append(p, btn);
      document.getElementById("inbox").prepend(row);
    }

    function enqueue(fn) {
      sendChain = sendChain.then(fn, fn);
      return sendChain;
    }

    async function sendDirect(file) {
      channel.send(JSON.stringify({ t: "file", name: file.name, size: file.size, mime: file.type }));
      const size = 16 * 1024;
      for (let offset = 0; offset < file.size; offset += size) {
        while (channel.bufferedAmount > 1024 * 1024) await new Promise((r) => setTimeout(r, 20));
        channel.send(await file.slice(offset, offset + size).arrayBuffer());
        progressEl.textContent = "Sending " + file.name + " " + Math.min(100, Math.round(((offset + size) / file.size) * 100)) + "%";
      }
      channel.send(JSON.stringify({ t: "end" }));
    }

    function sendRelay(file) {
      return new Promise((resolve, reject) => {
        const body = new FormData();
        body.append("token", token);
        body.append("file", file, file.name);
        const xhr = new XMLHttpRequest();
        xhr.open("POST", "/api/upload");
        xhr.upload.onprogress = (ev) => {
          if (ev.lengthComputable) progressEl.textContent = "Sending " + file.name + " " + Math.round((ev.loaded / ev.total) * 100) + "%";
        };
        xhr.onload = () => (xhr.status < 300 ? resolve() : reject(new Error("The other device did not get that")));
        xhr.onerror = () => reject(new Error("Could not reach the other device"));
        xhr.send(body);
      });
    }

    function downloadRelay(meta) {
      if (inApp) {
        fetch("/api/file/" + encodeURIComponent(meta.id) + "?token=" + encodeURIComponent(token))
          .then((res) => res.blob())
          .then((blob) => keepOnMac(blob, meta.name))
          .catch((err) => setStatus(err.message || "Could not save that file", "bad"));
        return;
      }
      const a = document.createElement("a");
      a.href = "/api/file/" + encodeURIComponent(meta.id) + "?token=" + encodeURIComponent(token);
      a.download = meta.name;
      a.click();
      noteReceived(meta.name);
    }

    document.getElementById("sendForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const note = document.getElementById("note").value.trim();
      if (!connected) {
        progressEl.textContent = "Wait until the other device has scanned.";
        progressEl.className = "bad";
        return;
      }
      if (!note && !picked.length) return;
      const files = picked.splice(0);
      document.getElementById("chips").replaceChildren();
      document.getElementById("send").disabled = true;
      enqueue(async () => {
        if (note) {
          if (mode === "webrtc" && channel && channel.readyState === "open") channel.send(JSON.stringify({ t: "text", text: note }));
          else ws.send(JSON.stringify({ type: "text", text: note }));
          document.getElementById("note").value = "";
        }
        for (const file of files) {
          if (mode === "webrtc") await sendDirect(file);
          else await sendRelay(file);
        }
        progressEl.textContent = "Sent.";
        progressEl.className = "ok";
        document.getElementById("send").disabled = false;
      }).catch((err) => {
        progressEl.textContent = err.message || "Send failed.";
        progressEl.className = "bad";
        document.getElementById("send").disabled = false;
      });
    });

    if (wanted) {
      pairEl.hidden = true;
      document.getElementById("title").textContent = "Joining";
      setStatus("Connecting to the other device…");
    }
    connectSocket();
  </script>
  <script src="/theme.js"></script>
</body>
</html>
