<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1c1917">
  <title>Pair with Mac</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #efece6;
      color: #1c1917;
      padding: 28px 20px;
    }
    .kicker { margin: 0; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: #6f6a63; }
    h1 { margin: 6px 0 8px; font-size: 32px; letter-spacing: -0.03em; }
    p { color: #6f6a63; line-height: 1.45; }
    form { margin-top: 22px; }
    input, button { font: inherit; width: 100%; font-size: 16px; }
    input {
      border: 1px solid #d8d2c8;
      background: #f7f5f1;
      border-radius: 14px;
      min-height: 54px;
      padding: 0 14px;
      letter-spacing: 0.18em;
      text-transform: lowercase;
    }
    button {
      margin-top: 10px;
      border: 0;
      background: #1c1917;
      color: #efece6;
      border-radius: 14px;
      min-height: 54px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <p class="kicker">SendToMac</p>
  <h1>Pair this phone</h1>
  <p>Type the code shown under the QR on your Mac. Or scan that QR — it opens this page already paired.</p>
  <form id="form">
    <input id="code" inputmode="text" autocapitalize="none" autocomplete="off" autocorrect="off" spellcheck="false" maxlength="12" placeholder="pairing code">
    <button type="submit">Continue</button>
  </form>
  <script>
    document.getElementById("form").addEventListener("submit", (e) => {
      e.preventDefault();
      const code = document.getElementById("code").value.trim().toLowerCase();
      if (code) location.href = "/m/" + encodeURIComponent(code);
    });
  </script>
</body>
</html>
